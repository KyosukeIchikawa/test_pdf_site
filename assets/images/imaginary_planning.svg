<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.9" />
            <stop offset="100%" style="stop-color:#2980b9;stop-opacity:0.9" />
        </linearGradient>
        <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:0.9" />
            <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:0.9" />
        </linearGradient>
        <linearGradient id="gradient3" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#f1c40f;stop-opacity:0.9" />
            <stop offset="100%" style="stop-color:#f39c12;stop-opacity:0.9" />
        </linearGradient>
        <filter id="dropshadow" height="130%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
            <feOffset dx="2" dy="2" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.5"/>
            </feComponentTransfer>
            <feMerge> 
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- 背景 -->
    <rect width="800" height="500" fill="#f8f9fa" rx="10" ry="10" />
    
    <!-- タイトル -->
    <text x="400" y="40" font-family="Roboto, sans-serif" font-size="24" text-anchor="middle" fill="#333">「想像上の空間」におけるプランニングプロセス</text>
    
    <!-- メインコンテンツ -->
    <rect x="50" y="70" width="700" height="410" rx="10" ry="10" fill="#ecf0f1" stroke="#34495e" stroke-width="2" filter="url(#dropshadow)" />
    
    <!-- 区切り線 -->
    <line x1="400" y1="70" x2="400" y2="480" stroke="#34495e" stroke-width="2" />
    
    <!-- 左側タイトル - 物理的空間 -->
    <text x="200" y="100" font-family="Roboto, sans-serif" font-size="20" text-anchor="middle" fill="#3498db" font-weight="bold">物理的空間（現実世界）</text>
    
    <!-- 右側タイトル - 想像上の空間 -->
    <text x="600" y="100" font-family="Roboto, sans-serif" font-size="20" text-anchor="middle" fill="#9b59b6" font-weight="bold">想像上の空間（内部モデル）</text>

    <!-- 左側コンテンツ - 物理空間での経験 -->
    <!-- オブジェクト1: リンゴ -->
    <circle cx="120" cy="170" r="30" fill="#e74c3c" filter="url(#dropshadow)" />
    <text x="120" y="175" font-family="Roboto, sans-serif" font-size="12" text-anchor="middle" fill="white">リンゴ</text>
    
    <!-- オブジェクト2: オレンジ -->
    <circle cx="200" cy="170" r="30" fill="#e67e22" filter="url(#dropshadow)" />
    <text x="200" y="175" font-family="Roboto, sans-serif" font-size="12" text-anchor="middle" fill="white">オレンジ</text>
    
    <!-- 手とアクション -->
    <rect x="120" y="230" width="120" height="60" rx="10" ry="10" fill="url(#gradient1)" filter="url(#dropshadow)" />
    <text x="180" y="265" font-family="Roboto, sans-serif" font-size="16" text-anchor="middle" fill="white">掴む行動</text>
    
    <!-- 経験のデータベース -->
    <rect x="80" y="330" width="240" height="100" rx="10" ry="10" fill="#ecf0f1" stroke="#3498db" stroke-width="2" filter="url(#dropshadow)" />
    <text x="200" y="355" font-family="Roboto, sans-serif" font-size="16" text-anchor="middle" fill="#3498db">過去の経験</text>
    <text x="200" y="380" font-family="Roboto, sans-serif" font-size="14" text-anchor="middle" fill="#333">・リンゴを掴む</text>
    <text x="200" y="405" font-family="Roboto, sans-serif" font-size="14" text-anchor="middle" fill="#333">・オレンジを掴む</text>
    
    <!-- アクションと結果の矢印 -->
    <path d="M120 200 L130 230" stroke="#333" stroke-width="2" fill="none" />
    <polygon points="130,230 122,222 135,220" fill="#333" />
    <path d="M200 200 L180 230" stroke="#333" stroke-width="2" fill="none" />
    <polygon points="180,230 175,220 188,222" fill="#333" />
    
    <!-- 経験への記録矢印 -->
    <path d="M180 290 L180 330" stroke="#333" stroke-width="2" fill="none" />
    <polygon points="180,330 175,320 185,320" fill="#333" />
    
    <!-- 右側コンテンツ - 想像空間でのプランニング -->
    <!-- 新しいオブジェクト: バナナ -->
    <path d="M590 160 C610 180, 630 170, 640 150 C650 130, 630 120, 610 130 C590 140, 570 140, 590 160 Z" fill="#f1c40f" filter="url(#dropshadow)" />
    <text x="605" y="150" font-family="Roboto, sans-serif" font-size="12" text-anchor="middle" fill="#333">バナナ</text>
    
    <!-- スキーマ抽出 -->
    <rect x="480" y="220" width="240" height="80" rx="10" ry="10" fill="url(#gradient2)" filter="url(#dropshadow)" />
    <text x="600" y="255" font-family="Roboto, sans-serif" font-size="16" text-anchor="middle" fill="white">スキーマ抽出</text>
    <text x="600" y="280" font-family="Roboto, sans-serif" font-size="14" text-anchor="middle" fill="white">「食べ物を掴む」という一般化</text>
    
    <!-- 計画生成 -->
    <rect x="480" y="340" width="240" height="80" rx="10" ry="10" fill="url(#gradient3)" filter="url(#dropshadow)" />
    <text x="600" y="370" font-family="Roboto, sans-serif" font-size="16" text-anchor="middle" fill="#333">プラン生成</text>
    <text x="600" y="395" font-family="Roboto, sans-serif" font-size="14" text-anchor="middle" fill="#333">「バナナを掴む」という計画</text>
    
    <!-- 知識転送の矢印 -->
    <path d="M320 380 C380 370, 420 360, 480 260" stroke="#9b59b6" stroke-width="3" fill="none" stroke-dasharray="5,5" />
    <polygon points="480,260 472,265 470,255" fill="#9b59b6" />
    <text x="400" y="330" font-family="Roboto, sans-serif" font-size="14" text-anchor="middle" fill="#9b59b6">知識転送</text>
    
    <!-- スキーマから計画への矢印 -->
    <path d="M600 300 L600 340" stroke="#333" stroke-width="2" fill="none" />
    <polygon points="600,340 595,330 605,330" fill="#333" />
    
    <!-- バナナからスキーマへの矢印 -->
    <path d="M605 170 L600 220" stroke="#333" stroke-width="2" fill="none" />
    <polygon points="600,220 595,210 605,210" fill="#333" />
    
    <!-- 実行への矢印 -->
    <path d="M480 380 C440 390, 420 400, 380 430" stroke="#f39c12" stroke-width="3" fill="none" />
    <polygon points="380,430 390,425 388,415" fill="#f39c12" />
    <text x="430" y="420" font-family="Roboto, sans-serif" font-size="14" text-anchor="middle" fill="#f39c12">実行へ</text>
    
    <!-- 流れを示す矢印 -->
    <text x="400" y="130" font-family="Roboto, sans-serif" font-size="14" text-anchor="middle" fill="#333">↓時間の流れ↓</text>
    
    <!-- 説明テキスト -->
    <rect x="50" y="490" width="700" height="0" fill="none" stroke="#3498db" stroke-width="2" />
</svg>